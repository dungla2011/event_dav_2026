<!DOCTYPE html>
<html>
<head>
    <title>D3.js Attribute Update Test</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: Arial; margin: 20px; }
        svg { border: 1px solid #ccc; }
        rect { fill: #4CAF50; stroke: #333; stroke-width: 1; }
        .controls { margin: 20px 0; }
        button { margin: 5px; padding: 8px 15px; }
        .info { background: #f0f0f0; padding: 10px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🧪 D3.js Attribute Update Test</h1>
    
    <div class="controls">
        <button onclick="testDirectUpdate()">🔄 Test Direct Attribute Update</button>
        <button onclick="testEnterUpdateExit()">🔄 Test Enter-Update-Exit Pattern</button>
        <button onclick="clearLog()">🧹 Clear Log</button>
    </div>
    
    <div id="log" class="info"></div>
    
    <svg width="400" height="200" id="test-svg">
    </svg>

    <script>
        let testData = [
            { id: 1, width: 100, height: 50, x: 50, y: 50 },
            { id: 2, width: 120, height: 60, x: 200, y: 50 }
        ];

        function log(message) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function initializeSVG() {
            const svg = d3.select("#test-svg");
            svg.selectAll("*").remove(); // Clear all elements

            const rects = svg.selectAll("rect")
                .data(testData)
                .enter()
                .append("rect")
                .attr("id", d => `rect-${d.id}`)
                .attr("x", d => d.x)
                .attr("y", d => d.y)
                .attr("width", d => d.width)
                .attr("height", d => d.height);

            log(`✅ Initialized ${testData.length} rectangles`);
            logCurrentDimensions();
        }

        function logCurrentDimensions() {
            const svg = d3.select("#test-svg");
            svg.selectAll("rect").each(function(d, i) {
                const rect = d3.select(this);
                const actualWidth = rect.attr("width");
                const actualHeight = rect.attr("height");
                log(`📊 Rect ${d.id}: data=${d.width}x${d.height}, DOM=${actualWidth}x${actualHeight}`);
            });
        }

        function testDirectUpdate() {
            log('🧪 Testing direct attribute update...');
            
            // Modify data
            testData[0].width = 150;
            testData[0].height = 80;
            testData[1].width = 160;
            testData[1].height = 90;

            log(`📝 Updated data: Rect1=${testData[0].width}x${testData[0].height}, Rect2=${testData[1].width}x${testData[1].height}`);

            // Update attributes directly
            const svg = d3.select("#test-svg");
            svg.selectAll("rect")
                .attr("width", d => d.width)
                .attr("height", d => d.height);

            log('✅ Direct update completed');
            logCurrentDimensions();
        }

        function testEnterUpdateExit() {
            log('🧪 Testing enter-update-exit pattern...');
            
            // Modify data
            testData[0].width = 200;
            testData[0].height = 100;
            testData[1].width = 220;
            testData[1].height = 120;

            log(`📝 Updated data: Rect1=${testData[0].width}x${testData[0].height}, Rect2=${testData[1].width}x${testData[1].height}`);

            const svg = d3.select("#test-svg");
            
            // Enter-Update-Exit pattern
            const rects = svg.selectAll("rect")
                .data(testData);

            // Remove old (exit)
            rects.exit().remove();

            // Add new (enter)
            const newRects = rects.enter()
                .append("rect")
                .attr("id", d => `rect-${d.id}`)
                .attr("x", d => d.x)
                .attr("y", d => d.y);

            // Update all (merge)
            const allRects = newRects.merge(rects);
            allRects
                .attr("width", d => d.width)
                .attr("height", d => d.height);

            log('✅ Enter-Update-Exit pattern completed');
            logCurrentDimensions();
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            initializeSVG();
        });
    </script>
</body>
</html>
