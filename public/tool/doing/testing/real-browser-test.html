<!DOCTYPE html>
<html>
<head>
    <title>Real Browser Dimension Test</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        #test-results { background: #f0f0f0; padding: 15px; border-radius: 5px; }
        .status { font-weight: bold; }
        .pass { color: green; }
        .fail { color: red; }
        iframe { width: 100%; height: 600px; border: 1px solid #ccc; margin-top: 10px; }
        #controls { margin: 10px 0; }
        button { margin: 5px; padding: 8px 15px; }
    </style>
</head>
<body>
    <h1>🧪 Real Browser Dimension Test</h1>
    <div id="controls">
        <button onclick="runDimensionTest()">🚀 Run Dimension Test</button>
        <button onclick="runManualTest()">✋ Manual Test (Safe)</button>
        <button onclick="clearResults()">🧹 Clear Results</button>
    </div>
    
    <div id="test-results"></div>
    <iframe id="app-frame" src="doing.html"></iframe>

    <script>
        function log(message, type = 'info') {
            const results = document.getElementById('test-results');
            const className = type === 'pass' ? 'status pass' : 
                            type === 'fail' ? 'status fail' : '';
            results.innerHTML += `<div class="${className}">${message}</div>`;
            results.scrollTop = results.scrollHeight;
        }

        function clearResults() {
            document.getElementById('test-results').innerHTML = '';
        }

        async function waitForElement(iframe, selector, timeout = 5000) {
            return new Promise((resolve, reject) => {
                const startTime = Date.now();
                function check() {
                    try {
                        const element = iframe.contentDocument.querySelector(selector);
                        if (element) {
                            resolve(element);
                        } else if (Date.now() - startTime > timeout) {
                            reject(new Error(`Element ${selector} not found within ${timeout}ms`));
                        } else {
                            setTimeout(check, 100);
                        }
                    } catch (e) {
                        setTimeout(check, 100);
                    }
                }
                check();
            });
        }

        async function runDimensionTest() {
            log('🔄 Starting real browser dimension test...', 'info');
            
            try {
                const iframe = document.getElementById('app-frame');
                
                // Wait for elements to be ready
                log('⏳ Waiting for application to load...');
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                const widthSlider = await waitForElement(iframe, '#widthSlider');
                const heightSlider = await waitForElement(iframe, '#heightSlider');
                const firstRect = await waitForElement(iframe, 'rect:not(.link-line)');
                
                log('✅ Elements found successfully');
                
                // Get initial values
                const initialWidth = parseInt(firstRect.getAttribute('width'));
                const initialHeight = parseInt(firstRect.getAttribute('height'));
                const initialSliderWidth = parseInt(widthSlider.value);
                const initialSliderHeight = parseInt(heightSlider.value);
                
                log(`📊 Initial values:`);
                log(`  - Rect: ${initialWidth}x${initialHeight}`);
                log(`  - Sliders: ${initialSliderWidth}x${initialSliderHeight}`);
                
                // Test width change
                log('🧪 Testing width change 180 → 250...');
                const targetWidth = 250;
                
                // Set slider value
                widthSlider.value = targetWidth;
                
                // Trigger input event
                const inputEvent = new Event('input', { bubbles: true });
                widthSlider.dispatchEvent(inputEvent);
                
                // Wait a bit for the update
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Check result
                const newWidth = parseInt(firstRect.getAttribute('width'));
                const sliderValue = parseInt(widthSlider.value);
                
                log(`📊 After width change:`);
                log(`  - Slider value: ${sliderValue}`);
                log(`  - Rect width: ${newWidth}`);
                log(`  - Global variable: ${iframe.contentWindow.defaultNodeWidth}`);
                
                if (newWidth === targetWidth) {
                    log(`✅ Width test PASSED: ${initialWidth} → ${newWidth}`, 'pass');
                } else {
                    log(`❌ Width test FAILED: Expected ${targetWidth}, got ${newWidth}`, 'fail');
                }
                
                // Test height change
                log('🧪 Testing height change 100 → 150...');
                const targetHeight = 150;
                
                heightSlider.value = targetHeight;
                const heightInputEvent = new Event('input', { bubbles: true });
                heightSlider.dispatchEvent(heightInputEvent);
                
                await new Promise(resolve => setTimeout(resolve, 500));
                
                const newHeight = parseInt(firstRect.getAttribute('height'));
                const heightSliderValue = parseInt(heightSlider.value);
                
                log(`📊 After height change:`);
                log(`  - Slider value: ${heightSliderValue}`);
                log(`  - Rect height: ${newHeight}`);
                log(`  - Global variable: ${iframe.contentWindow.defaultNodeHeight}`);
                
                if (newHeight === targetHeight) {
                    log(`✅ Height test PASSED: ${initialHeight} → ${newHeight}`, 'pass');
                } else {
                    log(`❌ Height test FAILED: Expected ${targetHeight}, got ${newHeight}`, 'fail');
                }
                
                // Restore original values
                log('🔄 Restoring original values...');
                widthSlider.value = initialSliderWidth;
                heightSlider.value = initialSliderHeight;
                widthSlider.dispatchEvent(new Event('input', { bubbles: true }));
                heightSlider.dispatchEvent(new Event('input', { bubbles: true }));
                
                log('🏁 Test completed!');
                
            } catch (error) {
                log(`❌ Test failed with error: ${error.message}`, 'fail');
                console.error('Test error:', error);
            }
        }

        async function runManualTest() {
            log('✋ Manual test mode - Please manually adjust sliders and check results', 'info');
            
            try {
                const iframe = document.getElementById('app-frame');
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                const firstRect = await waitForElement(iframe, 'rect:not(.link-line)');
                
                // Monitor changes every 2 seconds
                const monitoring = setInterval(() => {
                    try {
                        const width = parseInt(firstRect.getAttribute('width'));
                        const height = parseInt(firstRect.getAttribute('height'));
                        const globalWidth = iframe.contentWindow.defaultNodeWidth;
                        const globalHeight = iframe.contentWindow.defaultNodeHeight;
                        
                        log(`📊 Current: Rect=${width}x${height}, Global=${globalWidth}x${globalHeight}`);
                    } catch (e) {
                        console.error('Monitoring error:', e);
                    }
                }, 2000);
                
                // Stop monitoring after 30 seconds
                setTimeout(() => {
                    clearInterval(monitoring);
                    log('⏰ Manual test monitoring stopped');
                }, 30000);
                
            } catch (error) {
                log(`❌ Manual test setup failed: ${error.message}`, 'fail');
            }
        }
    </script>
</body>
</html>
