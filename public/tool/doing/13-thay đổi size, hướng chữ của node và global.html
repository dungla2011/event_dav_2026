                }
                
                newG.appendChild(nodeGroup);
            });
            
            return newSVG;
        }

        // Tạo SVG chuẩn cho CorelDRAW với cấu trúc tối ưu
        function createCorelDrawCompatibleSVG() {
            if (!root) return null;
            
            // Tính toán kích thước toàn bộ cây
            const nodes = root.descendants();
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            
            nodes.forEach(node => {
                const settings = getLevelSettings(node.depth);
                minX = Math.min(minX, node.x - settings.width/2);
                maxX = Math.max(maxX, node.x + settings.width/2);
                minY = Math.min(minY, node.y - settings.height/2);
                maxY = Math.max(maxY, node.y + settings.height/2);
            });
            
            const svgWidth = maxX - minX + 100; // thêm padding
            const svgHeight = maxY - minY + 100;
            const offsetX = -minX + 50;
            const offsetY = -minY + 50;
            
            // Tạo SVG với namespaces đầy đủ cho CorelDRAW
            const newSVG = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            newSVG.setAttribute("xmlns", "http://www.w3.org/2000/svg");
            newSVG.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");
            newSVG.setAttribute("width", Math.ceil(svgWidth) + "px");
            newSVG.setAttribute("height", Math.ceil(svgHeight) + "px");
            newSVG.setAttribute("viewBox", `0 0 ${Math.ceil(svgWidth)} ${Math.ceil(svgHeight)}`);
            newSVG.setAttribute("version", "1.1");
            
            // Style definitions trong <defs> cho CorelDRAW
            const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
            const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
            style.setAttribute("type", "text/css");
            style.textContent = `
                .family-text { font-family: Arial, sans-serif; font-weight: bold; font-size: 13px; fill: #2c3e50; text-anchor: middle; }
                .birth-text { font-family: Arial, sans-serif; font-size: 11px; fill: #7f8c8d; text-anchor: middle; }
                .death-text { font-family: Arial, sans-serif; font-size: 11px; fill: #7f8c8d; text-anchor: middle; }
                .title-text { font-family: Arial, sans-serif; font-size: 10px; fill: #34495e; text-anchor: middle; }
                .link-path { fill: none; stroke: #7f8c8d; stroke-width: 2; }
                .marriage-line { stroke: #e74c3c; stroke-width: 3; stroke-dasharray: 8,4; }
            `;
            defs.appendChild(style);
            newSVG.appendChild(defs);
            
            // Group chính cho tất cả elements
            const mainGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            mainGroup.setAttribute("id", "family-tree");
            
            // Group cho biological links (nền)
            const linksGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            linksGroup.setAttribute("id", "biological-links");
            
            // Group cho marriage links 
            const marriageGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            marriageGroup.setAttribute("id", "marriage-links");
            
            // Group cho nodes (trên cùng)
            const nodesGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            nodesGroup.setAttribute("id", "nodes");
            
            // Rebuild ARRAY_H_LINE để có paths chính xác
            const originalArrayHLine = [...ARRAY_H_LINE];
            ARRAY_H_LINE = [];
            customTreeLayout(root);
            
            // Get biological links
            const biologicalLinks = [];
            nodes.forEach(node => {
                if (node.parent) {
                    biologicalLinks.push({source: node.parent, target: node});
                }
            });
            
            // Get custom paths for biological links
            const sortedLinks = biologicalLinks.sort((a, b) => a.target.depth - b.target.depth);
            const linkPaths = new Map();
            
            sortedLinks.forEach((link, index) => {
                const pathD = customLinkPath(link);
                const linkKey = `${link.source.data.id}-to-${link.target.data.id}`;
                linkPaths.set(linkKey, pathD);
            });
            
            // Thêm biological links vào group
            biologicalLinks.forEach(link => {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const linkKey = `${link.source.data.id}-to-${link.target.data.id}`;
                const pathD = linkPaths.get(linkKey);
                
                if (pathD) {
                    // Transform path coordinates
                    const transformedPath = pathD.replace(/([ML])\s*([0-9.-]+)[,\s]+([0-9.-]+)/g, 
                        (match, command, x, y) => {
                            const newX = parseFloat(x) + offsetX;
                            const newY = parseFloat(y) + offsetY;
                            return `${command}${newX},${newY}`;
                        });
                    
                    path.setAttribute("d", transformedPath);
                    path.setAttribute("class", "link-path");
                    path.setAttribute("id", `link-${link.source.data.id}-${link.target.data.id}`);
                    linksGroup.appendChild(path);
                }
            });
            
            // Thêm marriage links
            const marriageLinks = detectMarriageLinks(nodes);
            marriageLinks.forEach(marriageLink => {
                const x1 = marriageLink.person.x + offsetX;
                const y1 = marriageLink.person.y + offsetY;
                const x2 = marriageLink.spouse.x + offsetX;
                const y2 = marriageLink.spouse.y + offsetY;
                
                const marriageLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                marriageLine.setAttribute("x1", x1);
                marriageLine.setAttribute("y1", y1);
                marriageLine.setAttribute("x2", x2);
                marriageLine.setAttribute("y2", y2);
                marriageLine.setAttribute("class", "marriage-line");
                marriageLine.setAttribute("id", `marriage-${marriageLink.person.data.id}-${marriageLink.spouse.data.id}`);
                marriageGroup.appendChild(marriageLine);
            });
            
            // Thêm nodes
            nodes.forEach(node => {
                const settings = getLevelSettings(node.depth);
                const displayOptions = getDisplayOptions(node.depth);
                
                // Group cho mỗi node
                const nodeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
                nodeGroup.setAttribute("id", `node-${node.data.id}`);
                nodeGroup.setAttribute("transform", `translate(${node.x + offsetX - settings.width/2}, ${node.y + offsetY - settings.height/2})`);
                
                // Rectangle
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("width", settings.width);
                rect.setAttribute("height", settings.height);
                rect.setAttribute("rx", "5");
                rect.setAttribute("ry", "5");
                rect.setAttribute("fill", "#ffffff");
                rect.setAttribute("stroke-width", "3");
                
                // Gender-based colors
                let strokeColor = "#95a5a6"; // unknown
                if (node.data.gender === 1) strokeColor = "#3498db"; // male
                else if (node.data.gender === 2) strokeColor = "#e91e63"; // female
                
                rect.setAttribute("stroke", strokeColor);
                
                // Deceased style
                if (node.data.date_of_death) {
                    rect.setAttribute("stroke", "#7f8c8d");
                    rect.setAttribute("stroke-dasharray", "8,4");
                }
                
                nodeGroup.appendChild(rect);
                
                // Text content
                const textRotation = getTextRotation(node.depth);
                let yPos = 20; // Start position
                const lineHeight = 16;
                
                // Name text
                const nameText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                nameText.setAttribute("class", "family-text");
                nameText.setAttribute("dominant-baseline", "middle");
                
                const nameX = settings.width / 2;
                if (textRotation === 'vertical-top') {
                    nameText.setAttribute("transform", `translate(${nameX}, ${yPos}) rotate(-90)`);
                    nameText.setAttribute("text-anchor", "end");
                } else if (textRotation === 'vertical-bottom') {
                    nameText.setAttribute("transform", `translate(${nameX}, ${yPos}) rotate(90)`);
                    nameText.setAttribute("text-anchor", "start");
                } else {
                    nameText.setAttribute("transform", `translate(${nameX}, ${yPos})`);
                }
                
                nameText.textContent = node.data.name || "Unknown";
                nodeGroup.appendChild(nameText);
                yPos += lineHeight;
                
                // Additional text fields...
                if (displayOptions.showTitle && node.data.title) {
                    const titleText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    titleText.setAttribute("class", "title-text");
                    titleText.setAttribute("dominant-baseline", "middle");
                    
                    const titleX = settings.width / 2;
                    if (textRotation === 'vertical-top') {
                        titleText.setAttribute("transform", `translate(${titleX}, ${yPos}) rotate(-90)`);
                        titleText.setAttribute("text-anchor", "end");
                    } else if (textRotation === 'vertical-bottom') {
                        titleText.setAttribute("transform", `translate(${titleX}, ${yPos}) rotate(90)`);
                        titleText.setAttribute("text-anchor", "start");
                    } else {
                        titleText.setAttribute("transform", `translate(${titleX}, ${yPos})`);
                    }
                    
                    titleText.textContent = node.data.title;
                    nodeGroup.appendChild(titleText);
                    yPos += lineHeight;
                }
                
                if (displayOptions.showBirthday && node.data.birthday) {
                    const birthdayText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    birthdayText.setAttribute("class", "birth-text");
                    birthdayText.setAttribute("dominant-baseline", "middle");
                    
                    const birthdayX = settings.width / 2;
                    if (textRotation === 'vertical-top') {
                        birthdayText.setAttribute("transform", `translate(${birthdayX}, ${yPos}) rotate(-90)`);
                        birthdayText.setAttribute("text-anchor", "end");
                    } else if (textRotation === 'vertical-bottom') {
                        birthdayText.setAttribute("transform", `translate(${birthdayX}, ${yPos}) rotate(90)`);
                        birthdayText.setAttribute("text-anchor", "start");
                    } else {
                        birthdayText.setAttribute("transform", `translate(${birthdayX}, ${yPos})`);
                    }
                    
                    birthdayText.textContent = formatDate(node.data.birthday);
                    nodeGroup.appendChild(birthdayText);
                    yPos += lineHeight;
                }
                
                if (displayOptions.showDeathDate && node.data.date_of_death) {
                    const deathText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    deathText.setAttribute("class", "death-text");
                    deathText.setAttribute("dominant-baseline", "middle");
                    
                    const deathX = settings.width / 2;
                    if (textRotation === 'vertical-top') {
                        deathText.setAttribute("transform", `translate(${deathX}, ${yPos}) rotate(-90)`);
                        deathText.setAttribute("text-anchor", "end");
                    } else if (textRotation === 'vertical-bottom') {
                        deathText.setAttribute("transform", `translate(${deathX}, ${yPos}) rotate(90)`);
                        deathText.setAttribute("text-anchor", "start");
                    } else {
                        deathText.setAttribute("transform", `translate(${deathX}, ${yPos})`);
                    }
                    
                    deathText.textContent = "✝ " + formatDate(node.data.date_of_death);
                    nodeGroup.appendChild(deathText);
                }
                
                nodesGroup.appendChild(nodeGroup);
            });
            
            // Thêm các groups theo thứ tự đúng (links trước, nodes sau)
            mainGroup.appendChild(linksGroup);
            mainGroup.appendChild(marriageGroup);
            mainGroup.appendChild(nodesGroup);
            newSVG.appendChild(mainGroup);
            
            // Restore original ARRAY_H_LINE
            ARRAY_H_LINE = originalArrayHLine;
            
            return newSVG.outerHTML;
        }

                    console.log(`📏 Link ${index + 1}: ${link.source.data.name} -> ${link.target.data.name}`);
                });

                ARRAY_H_LINE = originalArrayHLine;

                nodes.forEach(node => {

                marriageLinks.forEach((marriageLink, index) => {

                        const targetId = marriageLink.target._tempCellId;
                        
                        if (!sourceId || !targetId) {
                            console.warn(`⚠️ Missing temp cell ID for marriage link ${index}: source=${sourceId}, target=${targetId}`);
                            return;
                        }
                        
                        // Marriage links go first = send to back in draw.io
                        xml += `
        <mxCell id="${cellId}" value="" style="endArrow=none;html=1;strokeWidth=3;strokeColor=#e74c3c;strokeDasharray=8,4;entryX=0;entryY=0.5;entryDx=0;entryDy=0;exitX=1;exitY=0.5;exitDx=0;exitDy=0;" edge="1" parent="1" source="${sourceId}" target="${targetId}">
          <mxGeometry relative="1" as="geometry"/>
        </mxCell>`;
                        
                        cellId++;
                        console.log(`✓ Marriage link ${index + 1}/${marriageLinks.length}: ${marriageLink.person.name} ♥ ${marriageLink.spouse.name}`);
                    } catch (marriageError) {
                        console.error(`❌ Error processing marriage link ${index}:`, marriageError, marriageLink);
                    }
                });
                
                console.log(`📝 Starting cell ID from: ${cellId}`);
                nodes.forEach((node, index) => {
                    try {
                        const settings = getLevelSettings(node.depth);
                        const x = node.x - settings.width/2 + offsetX;
                        const y = node.y - settings.height/2 + offsetY;
                        
                        // Xác định màu stroke
                        let strokeColor = "#95a5a6"; // unknown
                        if (node.data.gender === 1) strokeColor = "#3498db"; // male
                        else if (node.data.gender === 2) strokeColor = "#e91e63"; // female
                        
                        // Deceased style
                        let strokeStyle = "";
                        if (node.data.date_of_death) {
                            strokeColor = "#7f8c8d";
                            strokeStyle = ";dashed=1";
                        }
                        
                        // Tạo text content
                        let text = node.data.name || "Unknown";
                        const displayOptions = getDisplayOptions(node.depth);
                        
                        if (displayOptions.showTitle && node.data.title) {
                            text += "\\n" + node.data.title;
                        }
                        
                        if (displayOptions.showBirthday && node.data.birthday) {
                            text += "\\n" + formatDate(node.data.birthday);
                        }
                        
                        if (displayOptions.showDeathDate && node.data.date_of_death) {
                            text += "\\n✝ " + formatDate(node.data.date_of_death);
                        }
                        
                        // Get text rotation for this level
                        const textRotation = getTextRotation(node.depth);
                        let safeText = (text || "").toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                        
                        // Add horizontal=0 for vertical text
                        let horizontalStyle = "";
                        if (textRotation === 'vertical-top' || textRotation === 'vertical-bottom') {
                            horizontalStyle = ";horizontal=0";
                        }
                        
                        // Sử dụng temp cell ID đã được assign
                        const currentCellId = node._tempCellId;
                        
                        xml += `
        <mxCell id="${currentCellId}" value="${safeText}" style="rounded=1;whiteSpace=wrap;html=1;strokeWidth=3;fillColor=#FFFFFF;strokeColor=${strokeColor};fontFamily=Arial;fontSize=13;fontStyle=1;align=center;verticalAlign=middle${strokeStyle}${horizontalStyle}" vertex="1" parent="1">
          <mxGeometry x="${x}" y="${y}" width="${settings.width}" height="${settings.height}" as="geometry"/>
        </mxCell>`;
                        
                        // Lưu cell ID cho node (sử dụng temp ID)
                        node._cellId = currentCellId;
                        
                        console.log(`✓ Node ${index + 1}/${nodes.length}: ${node.data.name} (ID: ${node._cellId})`);
                    } catch (nodeError) {
                        console.error(`❌ Error processing node ${index}:`, nodeError, node);
                    }
                });
                
                // Thêm edges (links) với custom waypoints
                biologicalLinks.forEach((link, index) => {
                    try {
                        const sourceId = link.source._cellId;
                        const targetId = link.target._cellId;
                        
                        if (!sourceId || !targetId) {
                            console.warn(`⚠️ Missing cell ID for link ${index}: source=${sourceId}, target=${targetId}`);
                            return;
                        }
                        
                        // Get custom path data
                        const linkKey = `${link.source.data.id}-to-${link.target.data.id}`;
                        const customPath = linkPaths.get(linkKey);
                        
                        // Parse custom path to get waypoints
                        let waypointXML = "";
                        if (customPath) {
                            // Extract coordinates from path
                            const pathCommands = customPath.split(/[ML]/);
                            const coordinates = [];
                            
                            pathCommands.forEach(cmd => {
                                const coords = cmd.trim().split(/[,\s]+/);
                                if (coords.length >= 2) {
                                    const x = parseFloat(coords[0]);
                                    const y = parseFloat(coords[1]);
                                    if (!isNaN(x) && !isNaN(y)) {
                                        coordinates.push({x: x + offsetX, y: y + offsetY});
                                    }
                                }
                            });
                            
                            // Adjust starting Y coordinate from bottom of parent to middle Y of parent
                            if (coordinates.length > 0) {
                                const parentSettings = getLevelSettings(link.source.depth);
                                const parentCenterY = link.source.y + offsetY; // Middle Y của parent
                                
                                // Modify first coordinate to use parent center Y instead of bottom Y
                                coordinates[0].y = parentCenterY;
                                
                                console.log(`🔧 Adjusted start Y for ${link.source.data.name} -> ${link.target.data.name}: Bottom → Center (${Math.round(parentCenterY)})`);
                            }
                            
                            // Create waypoints if we have intermediate points
                            if (coordinates.length > 2) {
                                const waypoints = coordinates.slice(1, -1); // Exclude start and end
                                if (waypoints.length > 0) {
                                    const waypointStrings = waypoints.map(wp => `<mxPoint x="${wp.x}" y="${wp.y}" as="sourcePoint"/>`);
                                    waypointXML = `
            <mxGeometry relative="1" as="geometry">
              <Array as="points">
                ${waypoints.map(wp => `<mxPoint x="${wp.x}" y="${wp.y}"/>`).join('\n                ')}
              </Array>
            </mxGeometry>`;
                                }
                            }
                        }
                        
                        // Create edge with custom waypoints or default geometry
                        const geometryXML = waypointXML || '<mxGeometry relative="1" as="geometry"/>';
                        
                        xml += `
        <mxCell id="${cellId}" value="" style="edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeWidth=2;strokeColor=#7f8c8d;entryX=0.5;entryY=0;entryDx=0;entryDy=0;exitX=0.5;exitY=1;exitDx=0;exitDy=0;endArrow=none;" edge="1" parent="1" source="${sourceId}" target="${targetId}">
          ${geometryXML}
        </mxCell>`;
                        
                        cellId++;
                        console.log(`✓ Link ${index + 1}/${biologicalLinks.length}: ${sourceId} -> ${targetId}`);
                    } catch (linkError) {
                        console.error(`❌ Error processing link ${index}:`, linkError, link);
                    }
                });
                
                xml += `
      </root>
    </mxGraphModel>
  </diagram>
</mxfile>`;
                
                console.log("✅ Draw.io XML created successfully");
                return xml;
            } catch (error) {
                console.error("❌ Error in createDrawIOXML:", error);
                return null;
            }
        }

        // Initialize event listeners when DOM is ready
        function initializeEventListeners() {
            // Level selector event listener
            const levelSelector = document.getElementById('levelSelector');
            if (levelSelector) {
                levelSelector.addEventListener('change', function(e) {
                    const level = parseInt(e.target.value);
                    selectLevel(level);
                });
            }
            
            // Level controls event listeners - respond immediately to changes with auto-save
            const levelWidth = document.getElementById('levelWidth');
            if (levelWidth) {
                levelWidth.addEventListener('input', function() {
                    updateLevelDisplay();
                    saveLevelSettings(); // Auto-save
                });
                levelWidth.addEventListener('change', function() {
                    updateLevelDisplay();
                    saveLevelSettings(); // Auto-save
                });
            }
            
            const levelHeight = document.getElementById('levelHeight');
            if (levelHeight) {
                levelHeight.addEventListener('input', function() {
                    updateLevelDisplay();
                    saveLevelSettings(); // Auto-save
                });
                levelHeight.addEventListener('change', function() {
                    updateLevelDisplay();
                    saveLevelSettings(); // Auto-save
                });
            }
            
            const levelSpacing = document.getElementById('levelNodeSpacing');
            if (levelSpacing) {
                levelSpacing.addEventListener('input', function() {
                    updateLevelDisplay();
                    saveLevelSettings(); // Auto-save
                });
                levelSpacing.addEventListener('change', function() {
                    updateLevelDisplay();
                    saveLevelSettings(); // Auto-save
                });
            }
            
            const resetSpaceLevelBtn = document.getElementById('resetSpaceLevel');
            if (resetSpaceLevelBtn) {
                resetSpaceLevelBtn.addEventListener('click', function() {
                    resetLevelSpacing();
                    saveLevelSettings(); // Auto-save after reset
                });
            }
            
            // Level text rotation event listener with auto-save and dimension switching
            const levelTextRotation = document.getElementById('levelTextRotation');
            if (levelTextRotation) {
                levelTextRotation.addEventListener('change', function() {
                    if (selectedLevel === -1) return; // No level selected
                    
                    const newRotation = this.value;
                    const currentRotation = this.dataset.previousValue || '';
                    
                    console.log(`🔄 Level ${selectedLevel} text rotation change: ${currentRotation} → ${newRotation}`);
                    
                    // Save current dimensions before switching (if there was a previous rotation)
                    if (currentRotation && currentRotation !== newRotation) {
                        const currentWidth = parseInt(document.getElementById('levelWidth').value) || nodeWidth;
                        const currentHeight = parseInt(document.getElementById('levelHeight').value) || nodeHeight;
                        
                        // Save current dimensions to the previous orientation
                        if (!levelSettings[selectedLevel].orientationDimensions) {
                            levelSettings[selectedLevel].orientationDimensions = {};
                        }
                        
                        const prevOrientationKey = (currentRotation === 'vertical-top' || currentRotation === 'vertical-bottom') ? 'vertical' : currentRotation;
                        levelSettings[selectedLevel].orientationDimensions[prevOrientationKey] = {
                            width: currentWidth,
                            height: currentHeight
                        };
                        
                        console.log(`💾 Saved level ${selectedLevel} dimensions for ${currentRotation} (key: ${prevOrientationKey}):`, { width: currentWidth, height: currentHeight });
                    }
                    
                    // Load dimensions for new orientation and update UI immediately
                    const orientationDimensions = loadLevelDimensionsForOrientation(selectedLevel, newRotation);
                    if (orientationDimensions) {
                        document.getElementById('levelWidth').value = orientationDimensions.width;
                        document.getElementById('levelHeight').value = orientationDimensions.height;
                        console.log(`✅ Updated level ${selectedLevel} UI inputs for ${newRotation}:`, orientationDimensions);
                    }
                    
                    // Store new rotation as previous value for next change
                    this.dataset.previousValue = newRotation;
                    
                    // Update the display and save settings
                    updateLevelDisplay();
                    saveLevelSettings(); // Auto-save
                });
            }
            
            // Level display options event listeners with auto-save
            const displayOptions = ['levelShowTitle', 'levelShowBirthday', 'levelShowDeathDate', 'levelShowImage'];
            displayOptions.forEach(optionId => {
                const element = document.getElementById(optionId);
                if (element) {
                    element.addEventListener('change', function() {
                        updateLevelDisplay();
                        saveLevelSettings(); // Auto-save
                    });
                }
            });
        }

        function loadDataJSON() {
            console.log("🔄 Đang load data.json...");
            
            const xhr = new XMLHttpRequest();
            xhr.open('GET', './data.json', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            const data = JSON.parse(xhr.responseText);
                            familyData = data;
                            console.log(`✅ Loaded ${data.length} family members from data.json`);
                            
                            // Debug thông tin root
                            const rootNode = data.find(p => p.parent_id === 0);
                            if (rootNode) {
                                console.log(`📍 Root node: ${rootNode.name} (ID: ${rootNode.id})`);
                                
                                // Tìm tất cả con của root
                                const rootChildren = data.filter(p => p.parent_id === rootNode.id);
                                console.log(`👨‍👩‍👧‍👦 Root has ${rootChildren.length} direct children:`);
                                rootChildren.forEach(child => {
                                    console.log(`   - ${child.name} (ID: ${child.id}, Gender: ${child.gender})`);
                                });
                            }
                            
                            processData();
                            updateDisplay();
                            updateStats();
                            centerTree();
                            
                            // Hiển thị thông báo thành công
                            setTimeout(() => {
                                console.log(`✅ Đã load thành công ${data.length} thành viên từ data.json!\n🌳 Có ${rootNode ? data.filter(p => p.parent_id === rootNode.id).length : 0} con của gốc cây.`);
                            }, 500);
                            
                        } catch (error) {
                            console.error("❌ JSON parsing error:", error);
                            alert("❌ Lỗi parse JSON: " + error.message + "\n🔄 Đang load dữ liệu mẫu...");
                            loadSampleData(); // Fallback to sample data
                        }
                    } else {
                        console.error("❌ HTTP Error:", xhr.status);
                        alert("🔄 Không thể load data.json, đang load dữ liệu mẫu...");
                        loadSampleData(); // Fallback to sample data
                    }
                }
            };
            xhr.send();
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            initializeEventListeners();
        });

        // Config management utility functions
        function exportConfig() {
            const globalConfig = JSON.parse(localStorage.getItem(CONFIG_KEYS.GLOBAL) || '{}');
            const levelConfig = JSON.parse(localStorage.getItem(CONFIG_KEYS.LEVELS) || '{}');
            
            const exportData = {
                version: '1.0',
                timestamp: new Date().toISOString(),
                global: globalConfig,
                levels: levelConfig
            };
            
            const blob = new Blob([JSON.stringify(exportData, null, 2)], {type: "application/json;charset=utf-8"});
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `family-tree-config-${new Date().toISOString().slice(0,10)}.json`;
            link.click();
            URL.revokeObjectURL(url);
            
            console.log("✅ Config exported:", exportData);
            alert("📤 Đã xuất cấu hình thành công!");
        }

        // Import configuration
        function importConfig() {
            const fileInput = document.getElementById('configFileInput');
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            const config = JSON.parse(e.target.result);
                            
                            // Validate config structure
                            if (!config || typeof config !== 'object') {
                                throw new Error('Invalid config format');
                            }
                            
                            // Import global config if exists
                            if (config.global) {
                                localStorage.setItem(CONFIG_KEYS.GLOBAL, JSON.stringify(config.global));
                                loadGlobalConfig(); // Apply global config
                            }
                            
                            // Import level configs if exists
                            if (config.levels) {
                                localStorage.setItem(CONFIG_KEYS.LEVELS, JSON.stringify(config.levels));
                                loadLevelSettings(); // Apply level settings
                            }
                            
                            // Refresh visualization
                            updateVisualization();
                            alert('Config imported successfully!');
                            
                        } catch (error) {
                            alert('Error importing config: ' + error.message);
                        }
                    };
                    reader.readAsText(file);
                }
                // Reset input
                fileInput.value = '';
            };
            fileInput.click();
        }

        function clearAllConfig() {
            if (confirm("🗑️ Bạn có chắc muốn xóa toàn bộ cấu hình đã lưu?")) {
                try {
                    localStorage.removeItem(CONFIG_KEYS.GLOBAL);
                    localStorage.removeItem(CONFIG_KEYS.LEVELS);
                    
                    // Reset to defaults
                    levelSettings = {};
                    selectedLevel = -1;
                    
                    // Reset UI to defaults
                    location.reload(); // Simple way to reset everything
                    
                    console.log("✅ All config cleared");
                } catch (error) {
                    console.error("❌ Failed to clear config:", error);
                    alert("❌ Lỗi khi xóa cấu hình!");
                }
            }
        }

        function importConfig(configData) {
            try {
                if (configData.global) {
                    localStorage.setItem(CONFIG_KEYS.GLOBAL, JSON.stringify(configData.global));
                }
                if (configData.levels) {
                    localStorage.setItem(CONFIG_KEYS.LEVELS, JSON.stringify(configData.levels));
                }
                
                console.log("✅ Config imported successfully");
                alert("📥 Đã nhập cấu hình thành công! Trang sẽ tự động load lại.");
                location.reload();
            } catch (error) {
                console.error("❌ Failed to import config:", error);
                alert("❌ Lỗi khi nhập cấu hình!");
            }
        }

    </script>
