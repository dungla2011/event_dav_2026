<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer - GLB</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
        
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
        
        button {
            margin: 2px;
            padding: 5px 10px;
            background: #444;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        button:hover {
            background: #666;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="loading">Đang tải model 3D...</div>
    
    <div id="info">
        <h3>3D Model Viewer</h3>
        <p>File: 1_web.glb</p>
        <p>Kích thước: 15.9 MB</p>
    </div>
    
    <div id="controls">
        <h4>Điều khiển:</h4>
        <button onclick="resetCamera()">Reset Camera</button>
        <button onclick="toggleWireframe()">Wireframe</button>
        <button onclick="toggleAnimation()">Animation</button>
        <br>
        <button onclick="increaseBrightness()">🔆 Sáng hơn</button>
        <button onclick="decreaseBrightness()">🔅 Tối hơn</button>
        <button onclick="toggleSuperBright()">⚡ Siêu sáng</button>
        <button onclick="setBlackBackground()">⚫ Nền đen</button>
        <button onclick="setWhiteBackground()">⚪ Nền trắng</button>
        <button onclick="setGrayBackground()">🔘 Nền xám</button>
        <br>
        <span style="font-size: 12px; color: #ccc;">Màu vật thể:</span>
        <button onclick="setModelColor('#ff0000')" style="background: #ff0000;">🔴</button>
        <button onclick="setModelColor('#00ff00')" style="background: #00ff00;">🟢</button>
        <button onclick="setModelColor('#0000ff')" style="background: #0000ff;">🔵</button>
        <button onclick="setModelColor('#ffff00')" style="background: #ffff00;">🟡</button>
        <button onclick="setModelColor('#ff00ff')" style="background: #ff00ff;">🟣</button>
        <button onclick="setModelColor('#00ffff')" style="background: #00ffff;">🔵</button>
        <button onclick="setModelColor('#ffffff')" style="background: #ffffff; color: #000;">⚪</button>
        <button onclick="resetModelColor()">↺ Gốc</button>
        <br>
        <span style="font-size: 12px; color: #ccc;">Chế độ hiển thị:</span>
        <button onclick="toggleMatcap()">🌟 Matcap</button>
        <button onclick="toggleNormalMap()">📐 Normal</button>
        <button onclick="enhanceContrast()">⚡ Tương phản</button>
        <button onclick="toggleDepthShading()">🎭 Depth</button>
        <br>
        <small>
            • Chuột trái: Xoay<br>
            • Chuột phải: Pan<br>
            • Scroll: Zoom
        </small>
    </div>

    <!-- Three.js ES6 Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        let scene, camera, renderer, controls, model;
        let wireframe = false;
        let animationId;
        let lights = []; // Lưu trữ tất cả lights để có thể điều chỉnh
        let superBrightMode = false;
        let originalMaterials = new Map(); // Lưu trữ màu gốc của materials
        let matcapMode = false;
        let normalMode = false;
        let contrastMode = false;
        let depthMode = false;
        
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(50, 50, 50);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2; // Giảm exposure để tăng tương phản
            renderer.physicallyCorrectLights = true;
            // Tăng gamma để làm nổi bật chi tiết
            renderer.gammaFactor = 2.2;
            document.body.appendChild(renderer.domElement);
            
            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.25;
            
            // Lights - Thiết lập để tạo tương phản tốt
            const ambientLight = new THREE.AmbientLight(0x404040, 0.4); // Giảm ambient để tăng tương phản
            scene.add(ambientLight);
            lights.push(ambientLight);
            
            // Key light - Ánh sáng chính từ góc cao
            const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
            keyLight.position.set(100, 100, 50);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.camera.near = 0.1;
            keyLight.shadow.camera.far = 500;
            keyLight.shadow.camera.left = -100;
            keyLight.shadow.camera.right = 100;
            keyLight.shadow.camera.top = 100;
            keyLight.shadow.camera.bottom = -100;
            scene.add(keyLight);
            lights.push(keyLight);
            
            // Fill light - Ánh sáng phụ để làm mềm bóng
            const fillLight = new THREE.DirectionalLight(0x7799ff, 0.6);
            fillLight.position.set(-50, 50, 50);
            scene.add(fillLight);
            lights.push(fillLight);
            
            // Rim light - Ánh sáng viền để tạo độ sâu
            const rimLight = new THREE.DirectionalLight(0xffaa77, 0.8);
            rimLight.position.set(-100, -50, -100);
            scene.add(rimLight);
            lights.push(rimLight);
            
            // Bottom light - Ánh sáng từ dưới lên
            const bottomLight = new THREE.DirectionalLight(0x6666ff, 0.3);
            bottomLight.position.set(0, -100, 0);
            scene.add(bottomLight);
            lights.push(bottomLight);
            
            // Load GLB model
            const loader = new GLTFLoader();
            
            loader.load(
                '1_web.glb',
                function (gltf) {
                    model = gltf.scene;
                    
                    // Cải thiện material để tăng tương phản và chi tiết
                    model.traverse(function (child) {
                        if (child.isMesh) {
                            if (child.material) {
                                // Clone material
                                child.material = child.material.clone();
                                
                                // Lưu trữ màu gốc và các thuộc tính
                                if (child.material.color) {
                                    originalMaterials.set(child, {
                                        color: child.material.color.clone(),
                                        emissive: child.material.emissive ? child.material.emissive.clone() : new THREE.Color(0x000000),
                                        roughness: child.material.roughness || 0.5,
                                        metalness: child.material.metalness || 0.0,
                                        material: child.material.clone()
                                    });
                                }
                                
                                // Tối ưu cho tương phản
                                if (child.material.roughness !== undefined) {
                                    child.material.roughness = 0.8; // Tăng roughness để giảm phản chiếu
                                }
                                
                                if (child.material.metalness !== undefined) {
                                    child.material.metalness = 0.1; // Giảm metalness
                                }
                                
                                // Enable shadow
                                child.castShadow = true;
                                child.receiveShadow = true;
                                
                                // Cải thiện texture encoding
                                if (child.material.map) {
                                    child.material.map.encoding = THREE.sRGBEncoding;
                                }
                                
                                child.material.needsUpdate = true;
                            }
                        }
                    });
                    
                    // Scale model if needed
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    
                    // Center the model
                    model.position.sub(center);
                    
                    // Scale to reasonable size
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 50 / maxDim;
                    model.scale.multiplyScalar(scale);
                    
                    scene.add(model);
                    
                    // Hide loading
                    document.getElementById('loading').style.display = 'none';
                    
                    console.log('Model loaded successfully');
                    console.log('Vertices:', gltf.scene.children.length);
                },
                function (progress) {
                    const percent = (progress.loaded / progress.total * 100).toFixed(1);
                    document.getElementById('loading').textContent = `Đang tải: ${percent}%`;
                },
                function (error) {
                    console.error('Error loading model:', error);
                    document.getElementById('loading').textContent = 'Lỗi tải model!';
                }
            );
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize);
            
            // Start animation loop
            animate();
        }
        
        function animate() {
            animationId = requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function resetCamera() {
            controls.reset();
            camera.position.set(50, 50, 50);
        }
        
        function toggleWireframe() {
            if (!model) return;
            
            wireframe = !wireframe;
            model.traverse(function (child) {
                if (child.isMesh) {
                    child.material.wireframe = wireframe;
                }
            });
        }
        
        function toggleAnimation() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            } else {
                animate();
            }
        }
        
        function increaseBrightness() {
            lights.forEach(light => {
                if (light.intensity !== undefined) {
                    light.intensity = Math.min(light.intensity * 1.2, 5.0); // Tăng 20%, max 5.0
                }
            });
            console.log('Brightness increased');
        }
        
        function decreaseBrightness() {
            lights.forEach(light => {
                if (light.intensity !== undefined) {
                    light.intensity = Math.max(light.intensity * 0.8, 0.1); // Giảm 20%, min 0.1
                }
            });
            console.log('Brightness decreased');
        }
        
        function setBlackBackground() {
            scene.background = new THREE.Color(0x000000); // Đen
            console.log('Background set to black');
        }
        
        function setWhiteBackground() {
            scene.background = new THREE.Color(0xffffff); // Trắng
            console.log('Background set to white');
        }
        
        function setGrayBackground() {
            scene.background = new THREE.Color(0x808080); // Xám
            console.log('Background set to gray');
        }
        
        function toggleSuperBright() {
            superBrightMode = !superBrightMode;
            
            if (superBrightMode) {
                // Chế độ siêu sáng
                lights.forEach(light => {
                    if (light.intensity !== undefined) {
                        light.intensity *= 2.0; // Tăng gấp đôi
                    }
                });
                renderer.toneMappingExposure = 2.5; // Tăng exposure
                console.log('Super bright mode ON');
            } else {
                // Trở về bình thường
                lights.forEach(light => {
                    if (light.intensity !== undefined) {
                        light.intensity /= 2.0; // Giảm về bình thường
                    }
                });
                renderer.toneMappingExposure = 1.5; // Về exposure bình thường
                console.log('Super bright mode OFF');
            }
        }
        
        function setModelColor(colorHex) {
            if (!model) return;
            
            const color = new THREE.Color(colorHex);
            
            model.traverse(function (child) {
                if (child.isMesh && child.material) {
                    // Thiết lập màu mới
                    child.material.color.copy(color);
                    
                    // Điều chỉnh emissive để màu sáng hơn
                    if (child.material.emissive) {
                        child.material.emissive.copy(color).multiplyScalar(0.1);
                    }
                    
                    child.material.needsUpdate = true;
                }
            });
            
            console.log(`Model color changed to: ${colorHex}`);
        }
        
        function resetModelColor() {
            if (!model) return;
            
            model.traverse(function (child) {
                if (child.isMesh && child.material && originalMaterials.has(child)) {
                    const original = originalMaterials.get(child);
                    
                    // Khôi phục màu gốc
                    child.material.color.copy(original.color);
                    
                    if (child.material.emissive) {
                        child.material.emissive.copy(original.emissive);
                    }
                    
                    child.material.needsUpdate = true;
                }
            });
            
            console.log('Model color reset to original');
        }
        
        function toggleMatcap() {
            if (!model) return;
            
            matcapMode = !matcapMode;
            
            model.traverse(function (child) {
                if (child.isMesh && child.material) {
                    if (matcapMode) {
                        // Tạo matcap material đơn giản
                        const matcapMaterial = new THREE.MeshMatcapMaterial({
                            color: child.material.color || 0xffffff
                        });
                        child.material = matcapMaterial;
                    } else {
                        // Khôi phục material gốc
                        if (originalMaterials.has(child)) {
                            child.material = originalMaterials.get(child).material.clone();
                        }
                    }
                    child.material.needsUpdate = true;
                }
            });
            
            console.log(`Matcap mode: ${matcapMode ? 'ON' : 'OFF'}`);
        }
        
        function toggleNormalMap() {
            if (!model) return;
            
            normalMode = !normalMode;
            
            model.traverse(function (child) {
                if (child.isMesh && child.material) {
                    if (normalMode) {
                        // Tạo material hiển thị normal
                        const normalMaterial = new THREE.MeshNormalMaterial();
                        child.material = normalMaterial;
                    } else {
                        // Khôi phục material gốc
                        if (originalMaterials.has(child)) {
                            child.material = originalMaterials.get(child).material.clone();
                        }
                    }
                    child.material.needsUpdate = true;
                }
            });
            
            console.log(`Normal mode: ${normalMode ? 'ON' : 'OFF'}`);
        }
        
        function enhanceContrast() {
            if (!model) return;
            
            contrastMode = !contrastMode;
            
            if (contrastMode) {
                // Tăng cường tương phản
                lights.forEach(light => {
                    if (light.intensity !== undefined) {
                        light.intensity *= 1.5;
                    }
                });
                
                // Giảm ambient light để tăng độ tương phản
                lights[0].intensity = 0.2; // Ambient light
                
                renderer.toneMappingExposure = 0.8;
                
                model.traverse(function (child) {
                    if (child.isMesh && child.material) {
                        if (child.material.roughness !== undefined) {
                            child.material.roughness = 0.9;
                        }
                        child.material.needsUpdate = true;
                    }
                });
            } else {
                // Khôi phục bình thường
                lights.forEach(light => {
                    if (light.intensity !== undefined) {
                        light.intensity /= 1.5;
                    }
                });
                
                lights[0].intensity = 0.4; // Ambient light
                renderer.toneMappingExposure = 1.2;
                
                model.traverse(function (child) {
                    if (child.isMesh && child.material) {
                        if (child.material.roughness !== undefined) {
                            child.material.roughness = 0.8;
                        }
                        child.material.needsUpdate = true;
                    }
                });
            }
            
            console.log(`Contrast mode: ${contrastMode ? 'ON' : 'OFF'}`);
        }
        
        function toggleDepthShading() {
            if (!model) return;
            
            depthMode = !depthMode;
            
            model.traverse(function (child) {
                if (child.isMesh && child.material) {
                    if (depthMode) {
                        // Tạo material depth
                        const depthMaterial = new THREE.MeshDepthMaterial();
                        child.material = depthMaterial;
                    } else {
                        // Khôi phục material gốc
                        if (originalMaterials.has(child)) {
                            child.material = originalMaterials.get(child).material.clone();
                        }
                    }
                    child.material.needsUpdate = true;
                }
            });
            
            console.log(`Depth mode: ${depthMode ? 'ON' : 'OFF'}`);
        }
        
        // Make functions global so they can be called from HTML
        window.resetCamera = resetCamera;
        window.toggleWireframe = toggleWireframe;
        window.toggleAnimation = toggleAnimation;
        window.increaseBrightness = increaseBrightness;
        window.decreaseBrightness = decreaseBrightness;
        window.setBlackBackground = setBlackBackground;
        window.setWhiteBackground = setWhiteBackground;
        window.setGrayBackground = setGrayBackground;
        window.toggleSuperBright = toggleSuperBright;
        window.setModelColor = setModelColor;
        window.resetModelColor = resetModelColor;
        window.toggleMatcap = toggleMatcap;
        window.toggleNormalMap = toggleNormalMap;
        window.enhanceContrast = enhanceContrast;
        window.toggleDepthShading = toggleDepthShading;
        
        // Initialize when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
